apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-health
  namespace: k8s-health
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-health-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-health-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-health-nodes
subjects:
  - kind: ServiceAccount
    name: k8s-health
    namespace: k8s-health
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-health-resources
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-health-resources
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-health-resources
subjects:
  - kind: ServiceAccount
    name: k8s-health
    namespace: k8s-health
