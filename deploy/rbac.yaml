apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-health
  namespace: k8s-health
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-health-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-health-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-health-nodes
subjects:
  - kind: ServiceAccount
    name: k8s-health
    namespace: k8s-health
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-health-incidents
  namespace: k8s-health
rules:
  - apiGroups: ["health.k8s-ops-agent.io"]
    resources: ["clusterissues"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-health-incidents
  namespace: k8s-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-health-incidents
subjects:
  - kind: ServiceAccount
    name: k8s-health
    namespace: k8s-health
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-health-resources
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-health-resources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-health-resources
subjects:
  - kind: ServiceAccount
    name: k8s-health
    namespace: k8s-health
