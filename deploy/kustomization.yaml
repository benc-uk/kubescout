apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - incidents-crd.yaml
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml

# Overrides for the image tag in deployment
images:
  - name: kubescoutImage
    newTag: arm64
    
    # When using the GitHub Container Registry
    newName: ghcr.io/benc-uk/kubescout
    
    # When using local Kind cluster
    #newName: localhost/kubescout