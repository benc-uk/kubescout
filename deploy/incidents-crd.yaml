apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: incidents.kubescout.benc-uk.github.com
spec:
  group: kubescout.benc-uk.github.com
  scope: Cluster
  names:
    plural: incidents
    singular: incident
    kind: Incident
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .spec.lifecycle.state
        - name: Severity
          type: string
          jsonPath: .spec.analysis.severity
        - name: Title
          type: string
          jsonPath: .spec.analysis.title
        - name: Revision
          type: integer
          jsonPath: .spec.lifecycle.revision
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [identity, resources, analysis, lifecycle]
              properties:
                identity:
                  type: object
                  required: [observer, anchor, family]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: Incident identity is immutable.
                  properties:
                    observer:
                      type: string
                      maxLength: 63
                    family:
                      type: string
                      enum: [scheduling, container-failure, rollout, job-failure, node-health, service-availability]
                    anchor:
                      type: object
                      required: [kind, name, uid]
                      properties:
                        kind:
                          type: string
                        namespace:
                          type: string
                        name:
                          type: string
                        uid:
                          type: string
                resources:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [kind, name, uid]
                    properties:
                      kind:
                        type: string
                      namespace:
                        type: string
                      name:
                        type: string
                      uid:
                        type: string
                analysis:
                  type: object
                  required: [title, severity, impact, diagnosis, explanation, evidence_ids, recommendations, uncertainty, model, prompt_version, analysis_id]
                  properties:
                    title:
                      type: string
                      maxLength: 4000
                    severity:
                      type: string
                      enum: [low, medium, high, critical]
                    impact:
                      type: string
                      enum: [limited, degraded, unavailable]
                    diagnosis:
                      type: string
                      maxLength: 4000
                    explanation:
                      type: string
                      maxLength: 4000
                    evidence_ids:
                      type: array
                      maxItems: 50
                      items:
                        type: string
                        maxLength: 4000
                    recommendations:
                      type: array
                      maxItems: 10
                      items:
                        type: string
                        maxLength: 4000
                    uncertainty:
                      type: string
                      maxLength: 4000
                    model:
                      type: string
                    prompt_version:
                      type: string
                    analysis_id:
                      type: string
                lifecycle:
                  type: object
                  required: [state, revision, recurrences, raised_at, updated_at]
                  properties:
                    state:
                      type: string
                      enum: [open, resolved]
                    revision:
                      type: integer
                      format: int64
                      minimum: 1
                    recurrences:
                      type: integer
                      format: int64
                      minimum: 0
                    raised_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
                    resolved_at:
                      type: string
                      format: date-time
            status:
              type: object
              description: Human triage status and future external delivery-controller state; never written by the AI agent.
              x-kubernetes-preserve-unknown-fields: true
              properties:
                triage:
                  type: object
                  required: [dismissedRevision]
                  properties:
                    dismissedRevision:
                      type: integer
                      format: int64
                      minimum: 0
                      description: Dismissed only while this equals spec.lifecycle.revision. Zero restores visibility.
