apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescout-dashboard
  namespace: k8s-health
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubescout-dashboard
  namespace: k8s-health
rules:
  - apiGroups: ["health.k8s-ops-agent.io"]
    resources: ["clusterissues"]
    verbs: ["get", "list"]
  - apiGroups: ["health.k8s-ops-agent.io"]
    resources: ["clusterissues/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubescout-dashboard
  namespace: k8s-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubescout-dashboard
subjects:
  - kind: ServiceAccount
    name: kubescout-dashboard
    namespace: k8s-health
