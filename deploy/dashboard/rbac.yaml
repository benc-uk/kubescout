apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescout-dashboard
  namespace: kubescout
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescout-dashboard
rules:
  - apiGroups: ["kubescout.benc-uk.github.com"]
    resources: ["incidents"]
    verbs: ["get", "list"]
  - apiGroups: ["kubescout.benc-uk.github.com"]
    resources: ["incidents/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubescout-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubescout-dashboard
subjects:
  - kind: ServiceAccount
    name: kubescout-dashboard
    namespace: kubescout
