apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubescout
  namespace: kubescout
  labels:
    app.kubernetes.io/name: kubescout
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubescout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubescout
    spec:
      serviceAccountName: kubescout
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: localhost/kubescout:dev
          imagePullPolicy: Never
          args:
            - --auth-mode=in-cluster
            - --incident-namespace=kubescout
            - --observer-id=kind-all
            - --model-calls-per-hour=300
          # Omit both lists to watch all namespaces; configure at most one.
          env:
            - name: NAMESPACE_WATCH
              value: ""
            - name: NAMESPACE_IGNORE
              value: ""
          envFrom:
            - secretRef:
                name: kubescout-model
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
