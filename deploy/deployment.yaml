apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubescout
  namespace: kubescout
  labels:
    app.kubernetes.io/name: kubescout
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubescout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubescout
    spec:
      serviceAccountName: kubescout
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: kubescoutImage
          imagePullPolicy: Always
          args:
            - --auth-mode=in-cluster
            - --observer-id=kind-all
            - --model-calls-per-hour=300
            - --ai-log-dir=/var/log/kubescout/ai
          # Omit both lists to watch all namespaces; configure at most one.
          env:
            - name: NAMESPACE_WATCH
              value: ""
            - name: NAMESPACE_IGNORE
              value: ""
          envFrom:
            - secretRef:
                name: kubescout-model
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ai-transcripts
              mountPath: /var/log/kubescout
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: ai-transcripts
          emptyDir:
            sizeLimit: 128Mi
