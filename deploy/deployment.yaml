apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-health
  namespace: k8s-health
  labels:
    app.kubernetes.io/name: k8s-health
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-health
    spec:
      serviceAccountName: k8s-health
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer
          image: localhost/k8s-health:stage3
          imagePullPolicy: Never
          args:
            - --auth-mode=in-cluster
            - --namespace=default
            - --deterministic-only
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
