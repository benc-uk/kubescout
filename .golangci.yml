version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - wsl_v5
  settings:
    staticcheck:
      checks:
        - "SA*"
  exclusions:
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
