apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: default
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selfsigned-testzzzzz
  namespace: default
spec:
  secretName: selfsigned-test-tls
  dnsNames:
    - test.example.test
  issuerRef:
    name: selfsigned-issuerzzzzz
    kind: Issuer
    group: cert-manager.io